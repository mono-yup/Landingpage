# Deploy this folder as its OWN Netlify site (base/publish directory = landing-pages/yard-preview),
# on Flores's domain. It must never be served from the agency site.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Paid-traffic page, kept out of search results for now. Revisit if Flores wants it to rank.
    X-Robots-Tag = "noindex, nofollow"

# Internal notes live in this folder for convenience; do not publish them.
[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true
